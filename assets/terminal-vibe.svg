<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');

      text {
        font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, monospace;
      }

      /* Cursor Blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
      }

      /* Radar / Ping Animation */
      @keyframes ping {
        0% { r: 5; opacity: 1; }
        70% { r: 14; opacity: 0; }
        100% { r: 14; opacity: 0; }
      }
      .ping-circle {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: center;
      }

      /* Equalizer Bar Animations */
      @keyframes eq-1 { 0%, 100% { height: 6px; y: 344px; } 50% { height: 26px; y: 324px; } }
      @keyframes eq-2 { 0%, 100% { height: 18px; y: 332px; } 50% { height: 8px; y: 342px; } }
      @keyframes eq-3 { 0%, 100% { height: 10px; y: 340px; } 50% { height: 28px; y: 322px; } }
      @keyframes eq-4 { 0%, 100% { height: 24px; y: 326px; } 50% { height: 12px; y: 338px; } }
      @keyframes eq-5 { 0%, 100% { height: 8px; y: 342px; } 50% { height: 22px; y: 328px; } }
      @keyframes eq-6 { 0%, 100% { height: 22px; y: 328px; } 50% { height: 6px; y: 344px; } }
      @keyframes eq-7 { 0%, 100% { height: 14px; y: 336px; } 50% { height: 26px; y: 324px; } }
      @keyframes eq-8 { 0%, 100% { height: 26px; y: 324px; } 50% { height: 10px; y: 340px; } }

      .bar-1 { animation: eq-1 1.1s ease-in-out infinite; }
      .bar-2 { animation: eq-2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eq-3 1.3s ease-in-out infinite; }
      .bar-4 { animation: eq-4 0.8s ease-in-out infinite; }
      .bar-5 { animation: eq-5 1.2s ease-in-out infinite; }
      .bar-6 { animation: eq-6 1.0s ease-in-out infinite; }
      .bar-7 { animation: eq-7 1.4s ease-in-out infinite; }
      .bar-8 { animation: eq-8 0.85s ease-in-out infinite; }

      /* Rotating Matrix Ring */
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .rotating-ring {
        animation: rotateRing 16s linear infinite;
        transform-origin: 140px 180px;
      }
      @keyframes counterRotate {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .counter-ring {
        animation: counterRotate 12s linear infinite;
        transform-origin: 140px 180px;
      }

      /* Border Pulse */
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.5; }
        50% { stroke-opacity: 0.9; }
      }
      .window-border {
        animation: borderGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="836" height="396" rx="14" fill="url(#bg-grad)" stroke="url(#neon-border)" stroke-width="1.8" class="window-border"/>

  <!-- Window Header Bar -->
  <path d="M 2 16 A 14 14 0 0 1 16 2 L 824 2 A 14 14 0 0 1 838 16 L 838 42 L 2 42 Z" fill="#131822"/>
  <line x1="2" y1="42" x2="838" y2="42" stroke="#252d3d" stroke-width="1"/>

  <!-- macOS Window Buttons -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="420" y="26" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">
    vivek@rahagir-macbook: ~/workspace/vibing-terminal (zsh)
  </text>

  <!-- Live Status Badge Top Right -->
  <circle cx="760" cy="22" r="5" fill="#00ff87"/>
  <circle cx="760" cy="22" r="5" fill="#00ff87" class="ping-circle" opacity="0.75"/>
  <text x="772" y="26" fill="#00ff87" font-size="11" font-weight="600">LIVE</text>

  <!-- Command Line Prompt -->
  <text x="28" y="74" fill="#38bdf8" font-size="14" font-weight="600">rahagir@space:~$</text>
  <text x="175" y="74" fill="#f8fafc" font-size="14" font-weight="500">neofetch --telemetry --focus live</text>

  <!-- Divider Line -->
  <line x1="28" y1="92" x2="812" y2="92" stroke="#1f293d" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: CYBER MATRIX & AUDIO RADAR ================= -->
  <g transform="translate(0, 0)">
    <!-- Cyber Ring Background Disk -->
    <circle cx="140" cy="180" r="68" fill="#0d1524" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Rotating Cyber Orbit Rings -->
    <circle cx="140" cy="180" r="56" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-dasharray="8,6" class="rotating-ring" filter="url(#glow-soft)"/>
    <circle cx="140" cy="180" r="44" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="14,10" class="counter-ring"/>

    <!-- Center Icon: Glowing Code Symbol -->
    <text x="140" y="188" fill="#00ff87" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow-green)">&lt;/&gt;</text>

    <!-- Sub-badge -->
    <rect x="70" y="260" width="140" height="24" rx="12" fill="#131e30" stroke="#00ff87" stroke-width="1"/>
    <text x="140" y="276" fill="#00ff87" font-size="10.5" font-weight="600" text-anchor="middle">FULL STACK DEV</text>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM TELEMETRY ================= -->
  <g transform="translate(255, 126)">
    <!-- Row 1 -->
    <text x="0" y="0" fill="#38bdf8" font-size="13" font-weight="600">DEVELOPER</text>
    <text x="125" y="0" fill="#64748b" font-size="13">::</text>
    <text x="145" y="0" fill="#ffffff" font-size="13" font-weight="600">Vivek Yadav</text>
    <text x="245" y="0" fill="#00ff87" font-size="13" font-weight="500">(Rahagir / राहगीर)</text>

    <!-- Row 2 -->
    <text x="0" y="25" fill="#38bdf8" font-size="13" font-weight="600">PORTFOLIO</text>
    <text x="125" y="25" fill="#64748b" font-size="13">::</text>
    <text x="145" y="25" fill="#60efff" font-size="13" font-weight="600">vivek-rahagir.com ↗</text>

    <!-- Row 3 -->
    <text x="0" y="50" fill="#38bdf8" font-size="13" font-weight="600">EDUCATION</text>
    <text x="125" y="50" fill="#64748b" font-size="13">::</text>
    <text x="145" y="50" fill="#e2e8f0" font-size="13">B.Tech in CSE @ BML Munjal University</text>

    <!-- Row 4 -->
    <text x="0" y="75" fill="#38bdf8" font-size="13" font-weight="600">CORE TECH</text>
    <text x="125" y="75" fill="#64748b" font-size="13">::</text>
    <text x="145" y="75" fill="#f8fafc" font-size="13">React 19 • Next.js • TypeScript • Node.js</text>

    <!-- Row 5 -->
    <text x="0" y="100" fill="#38bdf8" font-size="13" font-weight="600">DATABASE</text>
    <text x="125" y="100" fill="#64748b" font-size="13">::</text>
    <text x="145" y="100" fill="#e2e8f0" font-size="13">MongoDB • PostgreSQL • Redis • REST APIs</text>

    <!-- Row 6 -->
    <text x="0" y="125" fill="#38bdf8" font-size="13" font-weight="600">PHILOSOPHY</text>
    <text x="125" y="125" fill="#64748b" font-size="13">::</text>
    <text x="145" y="125" fill="#fbbf24" font-size="13">Build ➔ Break ➔ Rebuild ➔ Optimize</text>

    <!-- Row 7 -->
    <text x="0" y="150" fill="#38bdf8" font-size="13" font-weight="600">STATUS</text>
    <text x="125" y="150" fill="#64748b" font-size="13">::</text>
    <text x="145" y="150" fill="#00ff87" font-size="13" font-weight="600">🟢 Ready to Build &amp; Open For Collaborations</text>
  </g>

  <!-- ================= BOTTOM BAR: NOW VIBING & INTERACTIVE PROMPT ================= -->
  <rect x="24" y="306" width="792" height="56" rx="10" fill="#111726" stroke="#1e293b" stroke-width="1"/>

  <!-- Music Waveform Equalizer -->
  <g transform="translate(38, 0)">
    <text x="0" y="340" fill="#38bdf8" font-size="16">🎧</text>
    <text x="26" y="338" fill="#94a3b8" font-size="11.5" font-weight="500">NOW VIBING:</text>
    <text x="110" y="338" fill="#ffffff" font-size="11.5" font-weight="600">Synthwave &amp; Lofi Coding Flow</text>

    <!-- 8 Equalizer Bars -->
    <rect x="315" width="4" rx="2" fill="#00ff87" class="bar-1"/>
    <rect x="323" width="4" rx="2" fill="#00ff87" class="bar-2"/>
    <rect x="331" width="4" rx="2" fill="#38bdf8" class="bar-3"/>
    <rect x="339" width="4" rx="2" fill="#38bdf8" class="bar-4"/>
    <rect x="347" width="4" rx="2" fill="#818cf8" class="bar-5"/>
    <rect x="355" width="4" rx="2" fill="#818cf8" class="bar-6"/>
    <rect x="363" width="4" rx="2" fill="#00ff87" class="bar-7"/>
    <rect x="371" width="4" rx="2" fill="#00ff87" class="bar-8"/>
  </g>

  <!-- Active Terminal Command & Blinking Cursor -->
  <g transform="translate(450, 338)">
    <text x="0" y="0" fill="#38bdf8" font-size="11.5" font-weight="600">$ git push origin</text>
    <text x="132" y="0" fill="#00ff87" font-size="11.5" font-weight="600">main</text>
    <text x="164" y="0" fill="#00ff87" font-size="13" font-weight="700" class="cursor">█</text>
  </g>

  <!-- Bottom Sub-line -->
  <text x="420" y="384" fill="#475569" font-size="10" text-anchor="middle">
    ⚡ Powered by clean code, high performance, and relentless curiosity • vivek-rahagir.com
  </text>
</svg>
